name: Temporary post-approval correction guard

on:
  push:
    branches:
      - review/post-approval-correction-guard

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerpilot_ci
          POSTGRES_PASSWORD: fake_ci_password
          POSTGRES_DB: ledgerpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerpilot_ci -d ledgerpilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGERPILOT_ENV: test
      LEDGERPILOT_DATABASE_URL: postgresql+psycopg://ledgerpilot_ci:fake_ci_password@127.0.0.1:5432/ledgerpilot_ci
      LEDGERPILOT_LOG_LEVEL: INFO
      LEDGERPILOT_AUTH_MODE: disabled
      LEDGERPILOT_DEV_AUTH_ENABLED: "false"
      LEDGERPILOT_DOCUMENT_MAX_BYTES: "10485760"
      LEDGERPILOT_DOCUMENT_STORAGE_BACKEND: local
      LEDGERPILOT_DOCUMENT_STORAGE_ROOT: local_storage
      LEDGERPILOT_MALWARE_SCANNER_MODE: disabled
      LEDGERPILOT_EXTRACTION_PROVIDER: disabled
      LEDGERPILOT_EXTRACTION_SCHEMA_VERSION: ledgerpilot.extraction.v1
      LEDGERPILOT_EXTRACTION_MAX_FIELDS: "500"
      LEDGERPILOT_EXTRACTION_MAX_VALUE_CHARS: "4000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/post-approval-correction-guard

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "src/ledgerpilot/persistence/repositories/extraction.py",
              "        return self._session.scalar(statement)\n\n    def list_runs_for_document(\n",
              '''        return self._session.scalar(statement)\n\n    def lock_run_for_document(\n        self,\n        *,\n        firm_id: UUID,\n        client_id: UUID,\n        document_id: UUID,\n        run_id: UUID,\n    ) -> ExtractionRun | None:\n        statement = (\n            select(ExtractionRun)\n            .where(\n                ExtractionRun.id == run_id,\n                ExtractionRun.firm_id == firm_id,\n                ExtractionRun.client_id == client_id,\n                ExtractionRun.document_id == document_id,\n            )\n            .with_for_update()\n        )\n        return self._session.scalar(statement)\n\n    def list_runs_for_document(\n''',
          )

          replace_once(
              "src/ledgerpilot/extraction/service.py",
              "from ledgerpilot.persistence.repositories.extraction import ExtractionRepository\n",
              "from ledgerpilot.persistence.repositories.extraction import ExtractionRepository\nfrom ledgerpilot.persistence.repositories.review import ReviewRepository\n",
          )
          replace_once(
              "src/ledgerpilot/extraction/service.py",
              "        self._extractions = ExtractionRepository(session)\n        self._audit = AuditService(session)\n",
              "        self._extractions = ExtractionRepository(session)\n        self._reviews = ReviewRepository(session)\n        self._audit = AuditService(session)\n",
          )
          replace_once(
              "src/ledgerpilot/extraction/service.py",
              '''        locked_field = self._extractions.lock_field_for_correction(\n            firm_id=principal.firm_id,\n            client_id=client_id,\n            document_id=document_id,\n            run_id=run_id,\n            field_id=field.id,\n        )\n''',
              '''        locked_run = self._extractions.lock_run_for_document(\n            firm_id=principal.firm_id,\n            client_id=client_id,\n            document_id=document_id,\n            run_id=run_id,\n        )\n        if locked_run is None:\n            raise ApiError(status_code=404, code="not_found", message="Not found.")\n        if self._reviews.has_approved_outcome_for_extraction(\n            firm_id=principal.firm_id,\n            client_id=client_id,\n            document_id=document_id,\n            extraction_run_id=run_id,\n        ):\n            raise ApiError(\n                status_code=409,\n                code="approved_record_locked",\n                message=(\n                    "Approved accounting evidence requires a controlled correction, "\n                    "reversal, or supersession workflow."\n                ),\n            )\n\n        locked_field = self._extractions.lock_field_for_correction(\n            firm_id=principal.firm_id,\n            client_id=client_id,\n            document_id=document_id,\n            run_id=run_id,\n            field_id=field.id,\n        )\n''',
          )

          replace_once(
              "src/ledgerpilot/review/outcomes.py",
              '''        corrections = self._extractions.list_corrections_for_run(\n            firm_id=task.firm_id,\n            client_id=task.client_id,\n            document_id=task.document_id,\n            run_id=task.extraction_run_id,\n        )\n''',
              '''        locked_extraction = self._extractions.lock_run_for_document(\n            firm_id=task.firm_id,\n            client_id=task.client_id,\n            document_id=task.document_id,\n            run_id=task.extraction_run_id,\n        )\n        if locked_extraction is None:\n            raise ApiError(\n                status_code=409,\n                code="decision_not_reviewable",\n                message="Accounting decision source extraction is not available.",\n            )\n        corrections = self._extractions.list_corrections_for_run(\n            firm_id=task.firm_id,\n            client_id=task.client_id,\n            document_id=task.document_id,\n            run_id=task.extraction_run_id,\n        )\n''',
          )

          replace_once(
              "tests/integration/test_review_task_api.py",
              '''    assert approved.status_code == 200\n    assert approved.json()["outcome"]["outcome_type"] == "corrected_and_approved"\n    assert approved.json()["outcome"]["source_correction_count"] == 1\n\n    stale_document, stale_extraction, stale_decision, stale_payload = _create_decision(\n''',
              '''    assert approved.status_code == 200\n    assert approved.json()["outcome"]["outcome_type"] == "corrected_and_approved"\n    assert approved.json()["outcome"]["source_correction_count"] == 1\n\n    post_approval_correction = _correct_field(\n        client,\n        identity_seed,\n        document_id=document_id,\n        extraction_run_id=extraction_run_id,\n        field_id=UUID(total_field["id"]),\n        normalized_value="103.00",\n        request_id="req-phase5-correction-after-approval",\n    )\n    assert post_approval_correction.status_code == 409\n    assert post_approval_correction.json()["error"]["code"] == "approved_record_locked"\n\n    stale_document, stale_extraction, stale_decision, stale_payload = _create_decision(\n''',
          )

          replace_once(
              "docs/HUMAN_REVIEW.md",
              "Post-approval reversal/supersession is not implemented in Phase 5.\n",
              '''Direct extraction corrections are rejected with `approved_record_locked` once an approved\nreview outcome is linked to that extraction. Approval and correction both lock the extraction run\nbefore checking/writing correction state, so a concurrent correction cannot race past approval and a\nconcurrent approval cannot miss a correction that committed first.\n\nPost-approval correction/reversal/supersession remains a future controlled workflow.\n''',
          )
          PY

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format changed Python files
        run: python -m ruff format src/ledgerpilot/persistence/repositories/extraction.py src/ledgerpilot/extraction/service.py src/ledgerpilot/review/outcomes.py tests/integration/test_review_task_api.py

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Focused review regression
        run: python -m pytest tests/integration/test_review_task_api.py

      - name: Full regression suite
        run: python -m pytest --cov=ledgerpilot --cov-report=term-missing

      - name: Build
        run: python -m build

      - name: Diff safety check
        run: |
          git diff --check
          git status --short
          git diff -- src/ledgerpilot/persistence/repositories/extraction.py src/ledgerpilot/extraction/service.py src/ledgerpilot/review/outcomes.py tests/integration/test_review_task_api.py docs/HUMAN_REVIEW.md

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ledgerpilot/persistence/repositories/extraction.py src/ledgerpilot/extraction/service.py src/ledgerpilot/review/outcomes.py tests/integration/test_review_task_api.py docs/HUMAN_REVIEW.md
          git commit -m "fix: lock approved extraction evidence"
          git push origin HEAD:review/post-approval-correction-guard

name: Temporary Phase 5 Ruff format fix

on:
  push:
    branches:
      - review/phase-05-human-review-completion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/phase-05-human-review-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.5
      - name: Format only Phase 5 flagged files
        run: |
          python -m ruff format \
            src/ledgerpilot/review/outcomes.py \
            tests/integration/test_migrations.py \
            tests/integration/test_review_task_api.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ledgerpilot/review/outcomes.py \
            tests/integration/test_migrations.py \
            tests/integration/test_review_task_api.py
          git commit -m "chore: apply Ruff formatting"
          git push origin HEAD:review/phase-05-human-review-completion

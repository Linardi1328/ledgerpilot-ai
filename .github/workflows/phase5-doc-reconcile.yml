name: Temporary Phase 5 documentation reconciliation

on:
  push:
    branches:
      - review/phase-05-human-review-completion

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/phase-05-human-review-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile Phase 5 status and API documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          text = readme_path.read_text()
          text = text.replace(
              "**Current status: Phase 5 — Human Review, first slice (review branch)**",
              "**Current status: Phase 5 — Human Review completion (review branch)**",
              1,
          )
          text = text.replace("## Implemented Through Phase 4", "## Implemented Through Phase 5", 1)
          text = text.replace(
              "There is no raw document download endpoint through the current Phase 5 first slice.",
              "There is no raw document download endpoint through Phase 5.",
              1,
          )

          phase5_start = text.index("## Phase 5 Human Review — First Slice")
          planned_start = text.index("## Planned Capabilities", phase5_start)
          phase5_section = '''## Phase 5 Human Review — Completion

The current review branch completes the human-supervised Phase 5 workflow:

- one scoped review task per succeeded Phase 4 accounting decision;
- deterministic `ordinary`, `senior_review_required`, and `blocked` risk classes;
- Accountant/Senior Reviewer ownership restricted to authorised clients;
- public create/read, senior-escalation, comment, information-request, approval, rejection, and history boundaries;
- client-submitters receive only the outstanding information request and response boundary;
- ordinary approval by the assigned authorised reviewer and senior-only approval for senior-routed work;
- deterministic approval blocking for missing/unbalanced journals and error findings;
- immutable review outcomes linked to the exact accounting decision and proposed journal;
- `corrected_and_approved` outcomes when human extraction corrections preceded the reviewed decision;
- stale-source rejection when a newer extraction correction exists after the accounting decision;
- append-only review comments and audit events;
- read-only review history for authorised auditors;
- PostgreSQL constraints and row-locking around review ownership, scope, state, and terminal outcomes.

Creating, escalating, commenting on, or requesting information for a review task never converts an AI/rule recommendation into an approval. Approval is an explicit attributable human workflow outcome and does not mutate the underlying Phase 4 decision or proposed journal. Posting, payment execution, supplier-bank-detail changes, SQL Account export, production MyInvois integration, and production OCR/auth/storage remain out of scope. See [Human Review](docs/HUMAN_REVIEW.md).

'''
          text = text[:phase5_start] + phase5_section + text[planned_start:]

          planned_start = text.index("## Planned Capabilities")
          accounting_start = text.index("## Accounting Controls", planned_start)
          planned_section = '''## Planned Capabilities

- Production-grade document storage, malware scanning, retention, and secure retrieval.
- Production OCR provider integration.
- Practitioner-validated accounting and tax configuration.
- Controlled post-approval correction, reversal, and supersession workflows.
- Cross-decision review-queue/query APIs for larger operational workloads.
- Future accounting-platform export.
- Future Malaysian MyInvois/e-Invoice support.

'''
          text = text[:planned_start] + planned_section + text[accounting_start:]

          human_start = text.index("## Human Review")
          tech_start = text.index("## Proposed Technology", human_start)
          human_section = '''## Human Review

Phase 5 adds a controlled human-review workflow on top of succeeded accounting decisions.

The implemented review-task endpoints are rooted at:

`/api/v1/clients/{client_id}/documents/{document_id}/extractions/{extraction_run_id}/accounting-decisions/{decision_run_id}/review-tasks`

Implemented operations include:

- `POST /review-tasks`
- `GET /review-tasks`
- `GET /review-tasks/{review_task_id}`
- `POST /review-tasks/{review_task_id}/escalations`
- `POST /review-tasks/{review_task_id}/comments`
- `POST /review-tasks/{review_task_id}/information-requests`
- `GET /review-tasks/{review_task_id}/information-request`
- `POST /review-tasks/{review_task_id}/information-responses`
- `POST /review-tasks/{review_task_id}/approve`
- `POST /review-tasks/{review_task_id}/reject`
- `GET /review-tasks/{review_task_id}/history`

Reviewer actions remain tenant/client scoped and backend-authorised. Client submitters do not receive internal review history. AI/rule recommendations remain recommendations until an authorised human approval outcome is recorded. Approved outcomes preserve exact decision/journal/source lineage and do not post entries or trigger external integrations. See [Human Review](docs/HUMAN_REVIEW.md).

'''
          text = text[:human_start] + human_section + text[tech_start:]

          old_disclaimer = "LedgerPilot AI is not production-ready. The current Phase 5 first slice establishes backend infrastructure, local-development secure document intake, deterministic structured extraction, a synthetic accounting-decision foundation, and controlled review-task creation/read/escalation state for review only. Production authentication, production deployment, production object storage, production malware scanning, production OCR, production accounting/tax policy, approvals, posting, SQL Account integration, and MyInvois integration are not implemented."
          new_disclaimer = "LedgerPilot AI is not production-ready. The current Phase 5 review branch establishes backend infrastructure, local-development secure document intake, deterministic structured extraction, a synthetic accounting-decision foundation, and an attributable human review/approval workflow. Production authentication, production deployment, production object storage, production malware scanning, production OCR, practitioner-validated accounting/tax policy, accounting posting, SQL Account integration, payment execution, and MyInvois integration are not implemented."
          if old_disclaimer not in text:
              raise SystemExit("README production disclaimer shape changed unexpectedly")
          text = text.replace(old_disclaimer, new_disclaimer, 1)
          readme_path.write_text(text)

          app_path = Path("src/ledgerpilot/api/app.py")
          app_text = app_path.read_text()
          old_app = 'description="Phase 5 human review foundation. Not production-ready.",'
          new_app = 'description="Phase 5 human review workflow. Not production-ready.",'
          if old_app not in app_text:
              raise SystemExit("OpenAPI description shape changed unexpectedly")
          app_path.write_text(app_text.replace(old_app, new_app, 1))

          test_path = Path("tests/integration/test_api.py")
          test_text = test_path.read_text()
          old_test = 'assert description == "Phase 5 human review foundation. Not production-ready."'
          new_test = 'assert description == "Phase 5 human review workflow. Not production-ready."'
          if old_test not in test_text:
              raise SystemExit("OpenAPI metadata test shape changed unexpectedly")
          test_path.write_text(test_text.replace(old_test, new_test, 1))
          PY
          python -m pip install ruff==0.16.5
          python -m ruff format src/ledgerpilot/api/app.py tests/integration/test_api.py
      - name: Commit exact reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/ledgerpilot/api/app.py tests/integration/test_api.py
          git diff --cached --quiet && exit 1
          git commit -m "docs: reconcile Phase 5 completion status"
          git push origin HEAD:review/phase-05-human-review-completion

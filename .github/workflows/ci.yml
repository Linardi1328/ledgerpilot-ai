name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerpilot_ci
          POSTGRES_PASSWORD: fake_ci_password
          POSTGRES_DB: ledgerpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerpilot_ci -d ledgerpilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LEDGERPILOT_ENV: test
      LEDGERPILOT_DATABASE_URL: postgresql+psycopg://ledgerpilot_ci:fake_ci_password@127.0.0.1:5432/ledgerpilot_ci
      LEDGERPILOT_LOG_LEVEL: INFO
      LEDGERPILOT_AUTH_MODE: disabled
      LEDGERPILOT_DEV_AUTH_ENABLED: "false"
      LEDGERPILOT_DOCUMENT_MAX_BYTES: "10485760"
      LEDGERPILOT_DOCUMENT_STORAGE_BACKEND: local
      LEDGERPILOT_DOCUMENT_STORAGE_ROOT: local_storage
      LEDGERPILOT_MALWARE_SCANNER_MODE: disabled
      LEDGERPILOT_EXTRACTION_PROVIDER: disabled
      LEDGERPILOT_EXTRACTION_SCHEMA_VERSION: ledgerpilot.extraction.v1
      LEDGERPILOT_EXTRACTION_MAX_FIELDS: "500"
      LEDGERPILOT_EXTRACTION_MAX_VALUE_CHARS: "4000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install package and development dependencies
        run: uv sync --extra dev --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy src

      - name: Alembic upgrade
        run: uv run --no-sync alembic upgrade head

      - name: Alembic downgrade and re-upgrade
        run: |
          uv run --no-sync alembic downgrade 0001_phase_1
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic downgrade base
          uv run --no-sync alembic upgrade head

      - name: PostgreSQL document constraint tests
        run: uv run --no-sync pytest tests/integration/test_postgresql_document_constraints.py

      - name: PostgreSQL extraction constraint tests
        run: uv run --no-sync pytest tests/integration/test_postgresql_extraction_constraints.py

      - name: PostgreSQL accounting constraint tests
        run: uv run --no-sync pytest tests/integration/test_postgresql_accounting_constraints.py

      - name: PostgreSQL review constraint tests
        run: uv run --no-sync pytest tests/integration/test_postgresql_review_constraints.py

      - name: PostgreSQL reconciliation constraint tests
        run: uv run --no-sync pytest tests/integration/test_postgresql_reconciliation_constraints.py

      - name: PostgreSQL reconciliation review constraint tests
        run: uv run --no-sync pytest tests/integration/test_postgresql_reconciliation_review_constraints.py

      - name: Pytest
        run: uv run --no-sync pytest --cov=ledgerpilot --cov-report=term-missing

      - name: Build
        run: uv run --no-sync python -m build

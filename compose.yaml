services:
  postgres:
    image: postgres:16
    container_name: ledgerpilot-postgres
    environment:
      POSTGRES_USER: ledgerpilot_dev
      POSTGRES_PASSWORD: fake_dev_password
      POSTGRES_DB: ledgerpilot_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpilot_dev -d ledgerpilot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ledgerpilot_postgres_data:/var/lib/postgresql/data

volumes:
  ledgerpilot_postgres_data:
